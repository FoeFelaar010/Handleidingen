<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zo werkt een 3D-printer</title>
<style>
:root{--bg:#F4F4F7;--text:#1D1D1F;--muted:#6E6E73;--accent:#62256C;--orange:#F69320;--panel:rgba(255,255,255,.92);--line:#E1E1E6;
  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
#view{position:relative;flex:1;min-height:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay svg{position:absolute;inset:0;width:100%;height:100%}
.lbl{position:absolute;transform:translate(-50%,-50%);padding:.3rem .65rem;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:clamp(.78rem,1.5vw,.95rem);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:0;transition:opacity .4s}
.lbl.on{opacity:1}
#chip{position:absolute;top:14px;left:14px;padding:.35rem .8rem;border-radius:999px;background:var(--panel);font-weight:700;font-size:.9rem;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}
#counter{position:absolute;top:14px;right:14px;padding:.45rem .9rem;border-radius:12px;background:var(--panel);font-weight:800;font-size:clamp(1rem,2.4vw,1.5rem);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08);display:none}
#counter small{display:block;font-size:.72rem;font-weight:600;color:var(--muted)}
#sub{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(92%,760px);padding:.7rem 1.1rem;border-radius:14px;background:var(--panel);font-size:clamp(1rem,2.2vw,1.3rem);font-weight:600;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.1)}
#title{position:absolute;left:50%;top:13%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .8s;width:92%}
#title.on{opacity:1}
#title b{display:block;font-size:clamp(1.6rem,4.6vw,3rem);color:var(--accent);letter-spacing:-.02em}
#title span{display:block;margin-top:.4rem;font-size:clamp(.95rem,2vw,1.15rem);color:var(--muted)}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.6rem clamp(.6rem,2vw,1.2rem);background:#fff;border-top:1px solid var(--line)}
#bar button{font:inherit;font-size:.88rem;font-weight:600;padding:.45rem .8rem;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);cursor:pointer}
#bar button:hover{border-color:var(--accent)}
#bar button.main{background:var(--accent);border-color:var(--accent);color:#fff;min-width:7.5rem}
#bar button.sc[aria-current="true"]{background:#F5EEF6;border-color:var(--accent);color:var(--accent)}
#bar button.rec{margin-left:auto}
#bar button.rec.on{background:#C62828;border-color:#C62828;color:#fff}
#scenes{display:flex;flex-wrap:wrap;gap:.35rem}
#time{flex:1 1 220px;accent-color:var(--accent);min-width:160px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:700px){#bar button.sc span{display:none}#bar button.rec{margin-left:0}}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="overlay"><svg id="lines"></svg></div>
    <div id="chip">1 · De spoel</div>
    <div id="counter"></div>
    <div id="title"><b>Van rol plastic naar jouw ontwerp.</b><span>Met meerdere rollen filament print je ook in kleur.</span></div>
    <div id="sub">Dit is filament: plastic op een rol.</div>
  </div>
  <div id="bar">
    <button class="main" id="play" type="button">Pauze</button>
    <button id="restart" type="button">Opnieuw</button>
    <div id="scenes"></div>
    <input id="time" type="range" min="0" max="75" step="0.05" value="0" aria-label="Tijdlijn">
    <button class="rec" id="rec" type="button">Opnemen als video</button>
  </div>
</div>

  let count=0;parts.forEach(g=>count+=g.attributes.position.count);const pos=new Float32Array(count*3),nor=new Float32Array(count*3);let o=0;
  parts.forEach(g=>{pos.set(g.attributes.position.array,o*3);nor.set(g.attributes.normal.array,o*3);o+=g.attributes.position.count;});

  if(i>=2){heat=Math.min(1,(i===2?lt:99)/8);}
  if(i===2){strandLen=lt>8?Math.min(9,(lt-8)*2.2):0; extruding=lt>8;}
  if(i===3){const up=ss(lt/2.5); bedY=lerp(lowBed,NZ-LAYER,up); const f=Math.max(0,Math.min(1,(lt-2.5)/10.5)); const p=pathAt(f); headXZ=[p[0],p[1]]; extruding=f>0&&f<1;

  if(st.i===1||st.extruding){gearL.rotation.z+=speed*3; gearR.rotation.z-=speed*3;}
  blades.rotation.z+=speed*(st.i>=3?22:4);
  if(head.position.distanceTo(prevHead)>0.3){updateTube(); prevHead.copy(head.position);}
  // camera
  const auto=camAt(T); const nowMs=performance.now();
  if(nowMs>userUntil){ if(userUntil!==0&&!blendFrom){blendFrom={p:camera.position.toArray(),t:controls.target.toArray()};blendStart=nowMs;}
    if(blendFrom){const u=ss((nowMs-blendStart)/1500); camera.position.fromArray(lv(blendFrom.p,auto.p,u)); controls.target.fromArray(lv(blendFrom.t,auto.t,u)); if(u>=1){blendFrom=null;userUntil=0;}}
    else {camera.position.fromArray(auto.p); controls.target.fromArray(auto.t);} }
  controls.update();
  renderer.render(scene,camera);
  placeLabels(st.i);
  if(rec&&comp)drawComposite(st.i);
}
requestAnimationFrame(frame);
})();
